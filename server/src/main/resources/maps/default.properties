# The Sundered Barrow: the default Dominion.
#
# Same format as Robot Worlds' world config. Coordinates are x1,y1,x2,y2, inclusive, with [0,0]
# at the top-left tile. Later keys paint over earlier ones, in sorted key order.
#
#   ruins  block movement, sight and missiles   (Robot Worlds' mountains)
#   swamp  passable, but every step costs double (was lakes)
#   abyss  impassable, but see and shoot across  (was bottomless pits)

map.width=48
map.height=32

# A rift splits the barrow north to south, crossed at its middle.
obstacle.abyss.1=23,6,24,13
obstacle.abyss.2=23,18,24,25
obstacle.abyss.3=44,28,46,30
obstacle.abyss.4=1,1,3,2

# Broken walls of the old barrow.
obstacle.ruins.01=8,5,14,5
obstacle.ruins.02=8,6,8,10
obstacle.ruins.03=33,26,39,26
obstacle.ruins.04=39,21,39,25
obstacle.ruins.05=19,2,21,3
obstacle.ruins.06=26,28,28,29
obstacle.ruins.07=4,20,6,22
obstacle.ruins.08=41,9,43,11
obstacle.ruins.09=17,14,17,17
obstacle.ruins.10=30,14,30,17
obstacle.ruins.11=13,26,14,26
obstacle.ruins.12=34,5,35,5

# Bogs that slow the living and the dead alike.
obstacle.swamp.1=10,22,16,27
obstacle.swamp.2=30,3,36,9
obstacle.swamp.3=1,12,4,16
obstacle.swamp.4=43,16,46,19
