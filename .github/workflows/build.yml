name: Build

# Runs scripts/gate.sh, the same gate the pre-push hook runs: the build and every test (including
# the acceptance tests that start real servers and play over real WebSockets), the placeholder and
# secret sweeps, the dependency vulnerability scan, the duplication check, and building the Docker
# image and running the container acceptance test against it (the runner has Docker). Every check
# lives in the gate, never here, so this file only installs the tools the gate needs.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OSV_SCANNER_VERSION: v2.5.1
  OSV_SCANNER_SHA256: f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to a commit, so an upstream release can't change the build.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # The release binary is checked against its published checksum before it runs.
      - name: Install osv-scanner
        run: |
          mkdir -p "$RUNNER_TOOL_CACHE/osv-scanner"
          bin="$RUNNER_TOOL_CACHE/osv-scanner/osv-scanner"
          curl -fsSL -o "$bin" \
            "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $bin" | sha256sum -c -
          chmod +x "$bin"
          echo "$RUNNER_TOOL_CACHE/osv-scanner" >> "$GITHUB_PATH"
      # Node (for the duplication check's npx) comes with the runner image.
      - name: Install dependencies
        run: bash scripts/gate.sh --install-deps
      - name: Gate
        run: bash scripts/gate.sh
